- en: Why DSIR?
  zh: 为什么使用 DSIR？
  fr: Pourquoi DSIR ?
- en: Health data are spread across platforms, with different table structures and geographical identifiers. Analysts repeatedly retrieve, clean and format data, while keeping their work reproducible and their reports consistent.
  zh: 卫生数据分散在不同平台，表格结构和地理编码也各不相同。分析人员需要反复下载、清洗和格式化数据，同时保证分析可复现、报告风格一致。
  fr: Les données de santé sont réparties entre plusieurs plateformes, avec des structures de tables et des identifiants géographiques différents. Les analystes répètent les étapes de collecte, de nettoyage et de mise en forme, tout en veillant à la reproductibilité des analyses et à la cohérence des rapports.
- en: DSIR brings commonly used global health data sources and analytical utilities into a consistent R workflow, reducing repetitive data preparation and supporting reproducible analyses.
  zh: DSIR 将常用的全球卫生数据源与分析工具整合到一套连贯的 R 工作流程中，减少重复的数据准备工作，支持可复现的分析。
  fr: DSIR réunit les sources courantes de données de santé mondiale et les outils d'analyse dans un flux de travail R cohérent. Il réduit les tâches répétitives de préparation et facilite les analyses reproductibles.
- en: For technical teams preparing country comparisons, monitoring indicators and producing public health reports.
  zh: 适用于开展国家间比较、监测指标和编写公共卫生报告的技术团队。
  fr: Pour les équipes techniques qui comparent les pays, suivent les indicateurs et préparent des rapports de santé publique.
