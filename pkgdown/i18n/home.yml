- en: Data Science Infrastructure for Global Health
  zh: 全球卫生数据科学基础工具
  fr: Infrastructure de science des données pour la santé mondiale
- en: From Global Health Data to Clear Insights
  zh: 从全球卫生数据到清晰的分析结果
  fr: Des données de santé mondiale aux résultats clairs
- en: DSIR is an open-source R package that simplifies access to global health data, supports consistent data processing, and provides reusable tools for analysis and visualization.
  zh: DSIR 是一个开源 R 包，帮助你获取全球卫生数据、规范数据处理流程，并复用分析和可视化工具。
  fr: DSIR est un package R libre qui facilite l'accès aux données de santé mondiale, leur traitement cohérent, ainsi que leur analyse et leur visualisation.
