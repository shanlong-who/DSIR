- en: DSIR is a personally maintained open-source project. It is not an official WHO software product and is not endorsed or published by WHO.
  zh: DSIR 是由个人维护的开源项目，并非 WHO 官方软件产品，也未经 WHO 认可或由 WHO 发布。
  fr: DSIR est un projet libre maintenu à titre personnel. Ce n'est pas un logiciel officiel de l'OMS ; il n'est ni approuvé ni publié par l'OMS.
