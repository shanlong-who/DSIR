- en: Access Global Health Data
  zh: 获取全球卫生数据
  fr: Accéder aux données de santé mondiale
- en: Retrieve observations from WHO Global Health Observatory (GHO), WHO Global Health Estimates (GHE), and UN Sustainable Development Goals (SDG) services. Select countries, years and population breakdowns.
  zh: 从世界卫生组织全球卫生观察站（GHO）、全球卫生估计（GHE）以及联合国可持续发展目标（SDG）服务获取观测数据，按国家、年份和人群分层筛选。
  fr: Obtenir des observations auprès de l'Observatoire mondial de la santé de l'OMS (GHO), des estimations sanitaires mondiales de l'OMS (GHE) et des services des Nations Unies pour les objectifs de développement durable (ODD, ou SDG dans le code). Sélectionner les pays, les années et les sous-groupes de population.
- en: Explore WHO data access
  zh: 了解 WHO 数据获取方法
  fr: Découvrir l'accès aux données de l'OMS
- en: Harmonize Data
  zh: 统一数据结构
  fr: Harmoniser la structure des données
- en: Work with a consistent cleaned table structure, WHO Member State metadata and country identifiers. Keep additional dimensions and source information when needed.
  zh: 使用结构一致的清洗结果、WHO 会员国元数据与国家标识；需要时保留额外维度和来源信息。
  fr: Utiliser une structure de table nettoyée cohérente, les métadonnées des États Membres de l'OMS et les identifiants des pays. Conserver les dimensions supplémentaires et les informations de source si nécessaire.
- en: See data preparation tools
  zh: 查看数据整理工具
  fr: Voir les outils de préparation
- en: Analyse Health Indicators
  zh: 分析卫生指标
  fr: Analyser les indicateurs de santé
- en: Use life tables, direct age standardization and measures of annual progress to support mortality analysis and indicator monitoring.
  zh: 使用寿命表、直接年龄标准化和年度变化指标，开展死亡分析与卫生指标监测。
  fr: Utiliser les tables de mortalité, la standardisation directe sur l'âge et les mesures de progrès annuel pour analyser la mortalité et suivre les indicateurs.
- en: Explore analytical methods
  zh: 了解分析方法
  fr: Découvrir les méthodes d'analyse
- en: Visualize and Present Results
  zh: 可视化并呈现结果
  fr: Visualiser et présenter les résultats
- en: Apply reusable ggplot2 themes and flextable formatting to create consistent charts and analytical tables for technical reports.
  zh: 复用 ggplot2 主题和 flextable 格式，为技术报告制作风格一致的图形与分析表格。
  fr: Appliquer des thèmes ggplot2 et une mise en forme flextable réutilisables pour créer des graphiques et des tableaux cohérents dans les rapports techniques.
- en: View visualization examples
  zh: 查看可视化示例
  fr: Voir les exemples de visualisation
- en: A common table structure does not make indicator definitions or estimation methods comparable. Check source methods, population breakdowns and units before comparing results.
  zh: 表格结构相同，并不意味着指标定义或估计方法可比。比较结果前，请核对来源方法、人群分层和单位。
  fr: Une structure de table commune ne rend pas les définitions des indicateurs ni les méthodes d'estimation comparables. Vérifiez les méthodes des sources, les sous-groupes de population et les unités avant de comparer les résultats.
- en: From tools to tasks
  zh: 从工具到实际任务
  fr: Des outils aux tâches concrètes
- en: Practical applications
  zh: 实际应用
  fr: Applications pratiques
- en: For WHO technical teams and public health researchers working with international health data.
  zh: 面向使用国际卫生数据的 WHO 技术团队和公共卫生研究人员。
  fr: Pour les équipes techniques de l'OMS et les chercheurs en santé publique qui utilisent des données sanitaires internationales.
- en: Monitor health indicators
  zh: 监测卫生指标
  fr: Suivre les indicateurs de santé
- en: Explore observations across countries and years, keeping population groups and data sources visible.
  zh: 查看不同国家和年份的观测结果，同时保留人群分组与数据来源信息。
  fr: Explorer les observations par pays et par année, en conservant les informations sur les groupes de population et les sources.
- en: Explore mortality and disease burden
  zh: 分析死亡与疾病负担
  fr: Explorer la mortalité et la charge de morbidité
- en: Examine WHO estimates by cause, age, sex, country and year.
  zh: 按死因、年龄、性别、国家和年份查看 WHO 估计值。
  fr: Examiner les estimations de l'OMS par cause, âge, sexe, pays et année.
- en: Assess progress towards SDG targets
  zh: 评估 SDG 目标进展
  fr: Évaluer les progrès vers les cibles des ODD
- en: Retrieve health-related SDG series and analyse changes over time.
  zh: 获取与卫生相关的 SDG 序列，分析其随时间的变化。
  fr: Obtenir les séries des ODD liées à la santé et analyser leur évolution dans le temps.
- en: Prepare reproducible reports
  zh: 编写可复现报告
  fr: Préparer des rapports reproductibles
- en: Reuse data preparation steps, charts and table styles across analytical outputs.
  zh: 在不同分析成果中复用数据准备步骤、图形与表格样式。
  fr: Réutiliser les étapes de préparation, les graphiques et les styles de tableaux dans plusieurs analyses.
- en: These are potential uses of the package, not claims of official adoption by WHO.
  zh: 这些是本包可能的应用场景，不表示 WHO 已正式采用本包。
  fr: Il s'agit d'utilisations possibles du package, sans affirmation d'une adoption officielle par l'OMS.
- en: Ongoing development
  zh: 持续开发
  fr: Développement en cours
- en: Development roadmap
  zh: 开发方向
  fr: Feuille de route
- en: DSIR continues to evolve in response to practical needs in global health data analysis. Future development is planned to include GIS-related functions to support geospatial data processing, mapping and spatial analysis.
  zh: DSIR 根据全球卫生数据分析的实际需求持续改进。未来计划加入地理信息系统（GIS）相关功能，支持地理空间数据处理、制图和空间分析。
  fr: DSIR évolue selon les besoins pratiques de l'analyse des données de santé mondiale. Le développement prévu comprend des fonctions de systèmes d'information géographique (SIG) pour le traitement des données géospatiales, la cartographie et l'analyse spatiale.
- en: GIS capabilities are a future direction and are not part of the current release.
  zh: GIS 功能属于未来开发方向，当前版本尚未提供。
  fr: Les fonctions SIG constituent une orientation future et ne sont pas incluses dans la version actuelle.
