url: https://shanlong-who.github.io/DSIR/
template:
  bootstrap: 5
  bslib:
    primary: '#0093D5'
    base_font:
      google: Source Sans Pro
    heading_font:
      google: Source Sans Pro
    code_font:
      google: JetBrains Mono
home:
  title: DSIR — Data Science Infrastructure for Global Health
  description: |
    DSIR is an open-source R package for accessing global health data,
    preparing consistent tables, analysing health indicators, and producing
    reusable charts and tables for public health reporting.
  sidebar: false
  exclude:
    - CLAUDE.md
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - articles
    - news
    right:
    - language
    - search
    - github
  components:
    language:
      text: Language
      menu:
      - text: English
        href: index.html
      - text: 简体中文
        href: zh/index.html
      - text: Français
        href: fr/index.html
    home:
      text: Home
      href: index.html
    intro:
      text: Technical Overview
      href: articles/technical-overview.html
    reference:
      text: Function Reference
      href: reference/index.html
    articles:
      text: Tutorials
      menu:
      - text: Getting started with DSIR
        href: articles/DSIR.html
      - text: WHO xMart and Global Health Estimates
        href: articles/ghe-xmart.html
      - text: Visualizing indicators
        href: articles/visualizing-indicators.html
      - text: All tutorials
        href: articles/index.html
    news:
      text: Updates
      href: news/index.html
reference:
- title: WHO country metadata
  desc: Datasets and helpers for WHO Member States and regional groupings.
  contents:
  - who_countries
  - wpro_cty
  - afro_cty
  - amro_cty
  - searo_cty
  - euro_cty
  - emro_cty
  - pic_cty
  - iso3_to_region
  - iso3_to_m49
  - m49_to_iso3
- title: Demographic methods
  desc: Life tables and age standardization for mortality and rate analysis.
  contents:
  - life_table
  - age_standardize
  - who_std_pop
- title: GHO indicator data
  desc: WHO Global Health Observatory queries with legacy compatibility and per-call xMart selection.
  contents:
  - gho_indicators
  - gho_dimensions
  - gho_data
  - gho_clean
  - gho_count
  - gho_coverage
  - gho_has_data
  - gho_last_updated
  - bind_indicators
- title: GHE estimates
  desc: Current WHO Global Health Estimates with exact cause, age, sex and measure filters.
  contents:
  - ghe_data
  - ghe_causes
  - ghe_dimensions
  - ghe_coverage
  - ghe_clean
- title: SDG indicator data
  desc: Functions for fetching and cleaning data from the UN SDG API.
  contents:
  - sdg_goals
  - sdg_targets
  - sdg_areas
  - sdg_indicators
  - sdg_dimensions
  - sdg_data
  - sdg_clean
  - sdg_coverage
  - sdg_last_updated
- title: Visual themes
  desc: ggplot2 and flextable styling helpers for WHO-style outputs.
  contents:
  - theme_dsi
  - theme_dsi_facet
  - dsi_flextable_defaults
  - ggpie
  - scale_x_dsi_col
  - scale_y_dsi_col
- title: Utilities
  desc: Small mathematical and data helpers.
  contents:
  - geomean
  - aarr
  - snapshot
authors:
  Shanlong Ding:
    href: https://github.com/shanlong-who

