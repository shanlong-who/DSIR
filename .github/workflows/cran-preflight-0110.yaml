name: CRAN preflight 0.11.0

on:
  push:
    branches: [codex/cran-preflight-0110]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: devel}
          - {os: macos-15, r: devel}
          - {os: windows-latest, r: devel}
          - {os: windows-latest, r: 'oldrel/1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      NOT_CRAN: 'false'
      DSIR_RUN_LIVE_TESTS: 'false'
      DSIR_BUILD_LIVE_VIGNETTE: 'false'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_LIMIT_CORES_: 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
      - name: Verify the Apple Silicon R architecture
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          print(R.version)
          stopifnot(grepl("aarch64", R.version$platform, fixed = TRUE))
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-results: true
